name: Weekly AI Timeline Update

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:       # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  update-timeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare branches
        id: branches
        run: |
          git fetch origin
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # Ensure develop exists
          if git ls-remote --exit-code --heads origin develop > /dev/null 2>&1; then
            git checkout develop
            git pull origin develop
          else
            git checkout -b develop
            git push -u origin develop
          fi

          FEATURE="feature/weekly-ai-update-${DATE}"
          git checkout -b "$FEATURE"
          echo "feature=$FEATURE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install "anthropic>=0.40.0"

      - name: Research and update timeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPDATE_DATE: ${{ steps.branches.outputs.date }}
        run: python .github/scripts/update_timeline.py

      - name: Commit and push changes
        id: commit
        run: |
          git add script.js
          if git diff --staged --quiet; then
            echo "No new events found — nothing to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "$(printf 'feat: weekly AI timeline update %s\n\nAutomated update: added latest AI announcements from the past 7 days.\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>' '${{ steps.branches.outputs.date }}')"
            git push -u origin "${{ steps.branches.outputs.feature }}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and merge PR — feature → develop
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATURE: ${{ steps.branches.outputs.feature }}
          DATE: ${{ steps.branches.outputs.date }}
        run: |
          printf '## Weekly AI Timeline Update — %s\n\nAutomated research and addition of the latest AI announcements from the past 7 days.\n\n> Auto-merged by weekly CI. Revert the merge commit if any events need correction.\n\n🤖 Generated with [Claude Code](https://claude.ai/claude-code)\n' "$DATE" \
            > /tmp/feature_pr_body.md

          gh pr create \
            --base develop \
            --head "$FEATURE" \
            --title "feat: weekly AI timeline update $DATE" \
            --body-file /tmp/feature_pr_body.md \
            2>/dev/null || echo "PR may already exist, continuing to merge"

          gh pr merge "$FEATURE" --merge --delete-branch

      - name: Create and merge PR — develop → main
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.branches.outputs.date }}
        run: |
          git fetch origin

          AHEAD=$(git rev-list origin/main..origin/develop --count 2>/dev/null || echo "0")
          if [ "$AHEAD" -eq "0" ]; then
            echo "develop is not ahead of main — nothing to promote"
            exit 0
          fi

          printf '## Promote Weekly Update to Main — %s\n\nMerging develop → main with the AI timeline update from %s.\n\n🤖 Generated with [Claude Code](https://claude.ai/claude-code)\n' "$DATE" "$DATE" \
            > /tmp/develop_pr_body.md

          gh pr create \
            --base main \
            --head develop \
            --title "chore: promote weekly update $DATE to main" \
            --body-file /tmp/develop_pr_body.md \
            2>/dev/null || echo "PR may already exist, continuing to merge"

          gh pr merge develop --merge
